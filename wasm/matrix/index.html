<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <script src="/wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then(result => go.run(result.instance));
  </script>
  <style>
    body {
      height: 100%;
      width: 100%;
      background-color: #101012;
    }
  </style>
  <body>
    <canvas></canvas>
  </body>
</html>
