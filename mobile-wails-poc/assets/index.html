<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wails mobile POC</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1b2636; color: #f5f5f5;
               display: grid; place-items: center; min-height: 100vh; margin: 0; }
        main { text-align: center; padding: 1.5rem; }
        button { font-size: 1.05rem; padding: 0.7rem 1.2rem; border-radius: 8px;
                 border: 1px solid #4a5568; background: #2d3748; color: #f5f5f5; cursor: pointer; }
        #frag-time { color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
    <script type="module" src="/assets/js/datastar.js"></script>
</head>
<body>
    <main>
        <h1>Wails + Datastar + SQLite POC</h1>
        <div id="value-block">
            <p>SQLite row says: <strong id="db-value">{{.Value}}</strong></p>
            <p data-ignore id="frag-time">{{if .Time}}re-read at {{.Time}} (SSE){{end}}</p>
        </div>
        <button id="reload-btn" data-on:click="@get('/frag')">Re-read from SQLite (SSE)</button>
    </main>
</body>
</html>
