<div class="container" id="drop-area">
  <span class="overlay" id="overlay">Drop it like it's hot</span>
  
  <h1>Images to PDF</h1>
  <span class="subtitle">
    Combine a bunch of images to PDF in seconds.<br>
    Auto rotates and scales images to minimize whitespace.
  </span>

  <input type="file" id="file-input" multiple hidden accept=".png,.jpg,image/jpeg,image/png" />
  <button id="select-btn">Select images</button>
  <span class="footer-text">or drop your images here</span>

  <div id="preview-section" class="preview-section">
    <div id="upload-preview" class="grid"></div>
    <button id="merge-btn" class="merge-btn">Merge to PDF</button>
  </div>
</div>
