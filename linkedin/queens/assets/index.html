<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/index.css">
  <script src="assets/datastar.js" type="module" defer></script>
</head>
<body class="bg-gray-900 flex min-h-dvh items-center flex-col gap-4 px-4"
  data-signals="{_result: '', _error: ''}"
  data-on:paste="
    const items = event.clipboardData?.items
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();

        const dt = new DataTransfer();
        dt.items.add(file)
        
        const input = document.querySelector('input[type=file]');
        input.files = dt.files

        // trigger @post logic synthetically
        input.dispatchEvent(new Event('change', {bubbles: true}));
        break;
      }
    }
  "
>
  <h1 class="text-3xl sm:text-4xl md:text-5xl font-semibold text-gray-200 
    mt-8 mb-2 sm:mb-4 text-center"
  >Queens Puzzle Solver</h1>

  <span class="text-sm text-gray-400 text-center">
    Paste from clipboard or upload an image.
  </span>

  <form enctype="multipart/form-data" class="flex w-full min-w-0 items-center justify-center">
    <input type="file" name="upload" accept=".png,.jpg" 
      data-on:change="@post('/api/solve', {contentType: 'form'})"
      class="text-gray-400 text-sm file:text-gray-200 file:bg-slate-600 file:px-4 file:py-1 
        file:rounded-md file:font-semibold hover:file:cursor-pointer hover:file:bg-slate-700 
        file:mr-2 min-w-0
      "
    />
    <button type="reset" data-attr:hidden="!($_result || $_error)" 
      data-on:click="$_result = $_error = ''" class="hover:cursor-pointer shrink-0"
    >❌</button>
  </form>

  <span data-attr:hidden="$_error === ''" data-text="$_error" 
    class="text-red-400 italic mt-4 px-4"
  ></span>

  <canvas id="result"
    class="max-w-full h-auto rounded-md"
    data-attr:hidden="!$_result"
    data-effect="
      if ($_result) {
        const img = new Image();
        img.src = $_result;
        img.onload = () => {
          const canvas = document.getElementById('result');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
        };
      }
    "
  ></canvas>
</body>
</html>
