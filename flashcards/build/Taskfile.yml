version: '3'

# Common tasks shared by the android build (see build/android/Taskfile.yml).
# NOTE: this file was originally generated by `wails init` and then pruned to
# the tasks the Android build chain actually uses — see README ("Mobile build
# provenance").

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  build:frontend:
    summary: Build the frontend project
    run: once
    cmds:
      - echo "frontend assets are Go-embedded from assets/ — no frontend build step"
