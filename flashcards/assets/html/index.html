{{define "Study"}}
  <!DOCTYPE html>
  <html lang="en">
    <head>{{template "head"}}</head>
    <body
      class="bg-cream text-ink font-sans min-h-screen pb-24 md:pb-0
             md:flex md:flex-col md:min-h-screen"
      data-signals="{'hideMastered': false, 'revealed': false, 'idx': 0,
        'grade': '',
        'shuffleSeed': 0, 'force': false, 'confirm': false,
        'requeuedIds': [], 'droppedIds': [],
        'gradedIds': [],
        'passTotal': {{.Count}}, 'reviewed': 0}"
    >
      <div class="mx-auto w-full max-w-6xl px-4 md:px-8">
        {{template "header" "study"}}
        <main class="flex-1 w-full pb-8 md:flex md:gap-5 md:items-stretch">
          {{template "study-area" .}}
        </main>
      </div>
    </body>
  </html>
{{end}}
