{{define "head"}}
  <meta charset="UTF-8">
  <meta
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    name="viewport"
  >
  <title>Retro Flashcards</title>
  <link href="/assets/css/index.css" rel="stylesheet">
  <link href="/assets/static/manifest.webmanifest" rel="manifest">
  <link href="/assets/static/icon.svg" rel="icon" type="image/svg+xml">
  <meta content="#F7F3EC" name="theme-color">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <script defer src="/assets/js/datastar.js" type="module"></script>
  <script defer src="/assets/js/record.js"></script>
  <script defer src="/assets/js/camera.js"></script>
  <script defer src="/assets/js/mediapick.js"></script>
  <script defer src="/assets/js/fittext.js"></script>
  <script type="module">
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/assets/static/sw.js");
    }
  </script>
{{end}}

{{define "nav"}}
  {{/* Desktop: pill segmented control in the header.
                                            Mobile: fixed bottom tab bar, like the mockup .tb. */}}
  <nav
    class="fixed bottom-0 inset-x-0 z-10 h-16 flex border-t-2 border-ink
           bg-white md:static md:h-auto md:border-0 md:bg-transparent md:block"
  >
    <div
      class="flex w-full h-full md:box md:p-1.5 md:rounded-full md:w-auto
             md:gap-1.5
             md:h-auto md:shadow-retro"
    >
      <a
        class="flex-1 grid place-items-center font-semibold text-xs
               md:btn md:shadow-none md:min-h-9 md:px-5
               {{if eq . "study"}}bg-sun md:border-ink{{else}}bg-white{{end}}"
        href="/"
      >Study Mode</a>
      <a
        class="flex-1 grid place-items-center font-semibold text-xs
               md:btn md:shadow-none md:min-h-9 md:px-5
               {{if eq . "cards"}}bg-sun md:border-ink{{else}}bg-white{{end}}"
        href="/cards"
      >All Cards</a>
    </div>
  </nav>
{{end}}

{{define "header"}}
  <header class="flex items-center justify-between gap-2 py-4 md:py-5">
    <a class="flex items-center gap-2" href="/">
      <span class="logo-dot"></span>
      <b class="text-lg md:text-xl">Flashcard</b>
    </a>
    {{template "nav" .}}
  </header>
{{end}}
