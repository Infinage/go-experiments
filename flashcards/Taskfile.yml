version: '3'

vars:
  APP_NAME: "flashcards"
  APP_ID: "com.infinage.flashcards"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "npm" # labels only; frontend build is a no-op (Go-embedded assets)

includes:
  common: ./build/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  # ---------- android (thin wrappers; android:* tasks come from build/android) ----------
  apk:build:
    summary: Build the Android debug APK (libwails.so + gradle assembleDebug)
    cmds:
      # Physical-device target (arm64-v8a); the default is the host arch for emulators
      - task: android:build
        vars:
          ARCH: arm64
      - task: android:assemble:apk

  apk:run:device:
    summary: Install + launch the debug APK on the connected device (DEVICE_ID=<serial> to pick one)
    deps:
      - task: apk:build
    cmds:
      # `install -r` keeps app data (the seeded SQLite database) across reinstalls;
      # use `make apk-reinstall-clean` when a db schema change forces a wipe.
      - adb ${DEVICE_ID:+-s $DEVICE_ID} install -r {{.BIN_DIR}}/{{.APP_NAME}}.apk
      - adb ${DEVICE_ID:+-s $DEVICE_ID} shell am start -n {{.APP_ID}}/com.wails.app.MainActivity

  apk:push:db:
    summary: Copy a local SQLite db into the app files dir (SRC=path, default tmp/seed/flashcards.db)
    cmds:
      - |
        SRC="${SRC:-tmp/seed/flashcards.db}"
        test -f "$SRC" || { echo "seed db not found: $SRC"; exit 1; }
        # Remove stale WAL/shm files first — replaying an old journal over a
        # replaced main db resurrects the pre-seed data otherwise.
        adb ${DEVICE_ID:+-s $DEVICE_ID} shell "run-as {{.APP_ID}} sh -c 'rm -f files/flashcards.db-wal files/flashcards.db-shm'"
        adb ${DEVICE_ID:+-s $DEVICE_ID} shell "run-as {{.APP_ID}} mkdir -p files"
        adb ${DEVICE_ID:+-s $DEVICE_ID} push "$SRC" /data/local/tmp/flashcards-seed.db
        adb ${DEVICE_ID:+-s $DEVICE_ID} shell "run-as {{.APP_ID}} sh -c 'cat /data/local/tmp/flashcards-seed.db > files/flashcards.db'"
        adb ${DEVICE_ID:+-s $DEVICE_ID} shell rm /data/local/tmp/flashcards-seed.db
        echo "seeded {{.APP_ID}} files/flashcards.db from $SRC"

  apk:reinstall:clean:
    summary: Full uninstall + reinstall (wipes app data, including the seeded db)
    cmds:
      - adb ${DEVICE_ID:+-s $DEVICE_ID} uninstall {{.APP_ID}}
      - task: apk:run:device

  apk:logs:
    summary: Stream logcat from the device filtered to Flashcards output
    cmds:
      - task: android:logs

  apk:go-log:
    summary: Print the app's own Go log file (written on-device; see README)
    cmds:
      - adb ${DEVICE_ID:+-s $DEVICE_ID} shell run-as {{.APP_ID}} cat cache/flashcards-go.log

  clean:
    summary: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf build/android/app/build
      - rm -rf build/android/app/src/main/jniLibs/*/libwails.so
      - rm -rf build/android/.gradle
