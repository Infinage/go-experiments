<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>mobile-irgo-poc (html/template)</title>
    <script type="module" src="/static/js/datastar.js"></script>
</head>
<body data-signals="{sqliteRows: 0, dbPath: ''}">
    <h1>irgo POC — html/template page, no templ involved</h1>

    <section id="row-out">
        <p>Initial DB read (server-side render): <strong>{{.RowValue}}</strong></p>
        <p>DB path: <span data-text="$dbPath"></span></p>
    </section>

    <button
        id="reload-btn"
        data-on:click="@get('/api/card')"
    >Re-read row via SSE fragment</button>

    <p>Fragment patches received: <span data-text="$sqliteRows"></span></p>
</body>
</html>
